name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      VISION_DEVICE: cpu
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install media and PDF libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ffmpeg libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libffi-dev libjpeg-dev libopenjp2-7 fonts-dejavu-core poppler-utils
      - name: Install CPU test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -c "import torch; assert torch.version.cuda is None, torch.__version__"
      - name: Test every part without samples or models
        run: |
          unset BENCH_SAMPLES
          python -m pytest -m "not models" -q -ra --durations=15
